<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sui Wallet Monitor - Real-time Activity Tracker</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" stroke="url(#gradient)" stroke-width="4"/>
                    <circle cx="20" cy="20" r="10" fill="url(#gradient)"/>
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#6366f1"/>
                            <stop offset="100%" stop-color="#8b5cf6"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>Sui Wallet Monitor</h1>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <!-- Wallet Info -->
        <div class="wallet-card">
            <div class="wallet-header">
                <h2>Monitoring Wallet</h2>
                <button class="notification-btn" id="notificationBtn" title="Enable notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </button>
            </div>
            <div class="wallet-address">
                <span class="label">Address:</span>
                <code id="walletAddress">@pawtato-land</code>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Total Transactions</span>
                    <span class="stat-value" id="totalTx">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Last Activity</span>
                    <span class="stat-value" id="lastActivity">-</span>
                </div>
            </div>
        </div>

        <!-- Activity Feed -->
        <div class="activity-section">
            <div class="section-header">
                <h2>Recent Activity</h2>
                <div class="live-indicator">
                    <span class="pulse"></span>
                    <span>Live</span>
                </div>
            </div>

            <div id="transactionList" class="transaction-list">
                <!-- Transactions will be added here dynamically -->
            </div>

            <div id="emptyState" class="empty-state">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                <p>Waiting for transactions...</p>
            </div>

            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <p>Loading transactions...</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div class="toast-content">
            <div class="toast-icon">🔔</div>
            <div class="toast-message"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
